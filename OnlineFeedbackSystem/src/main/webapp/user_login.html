<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        /* Importing Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        /* General Page Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #2c3e50, #3498db);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Animated Floating Circles */
        .floating-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-bg span {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out alternate;
        }

        /* Different Sizes & Positions for Circles */
        .floating-bg span:nth-child(1) { top: 20%; left: 10%; width: 80px; height: 80px; animation-duration: 8s; }
        .floating-bg span:nth-child(2) { top: 60%; left: 70%; width: 60px; height: 60px; animation-duration: 7s; }
        .floating-bg span:nth-child(3) { top: 80%; left: 30%; width: 50px; height: 50px; animation-duration: 9s; }
        .floating-bg span:nth-child(4) { top: 10%; left: 50%; width: 70px; height: 70px; animation-duration: 6s; }

        /* Floating Animation */
        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-30px); }
        }

        /* Container Styling */
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
            animation: fadeIn 1s ease-in-out;
        }

        /* Fade-in Effect */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #333;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 500;
            text-align: left;
            color: #555;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s ease-in-out;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
            box-shadow: 0px 0px 5px rgba(52, 152, 219, 0.5);
        }

        /* Submit Button */
        input[type="submit"] {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease-in-out;
        }

        input[type="submit"]:hover {
            background: #2980b9;
            transform: scale(1.05);
            box-shadow: 0px 5px 15px rgba(52, 152, 219, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 400px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Background Elements -->
    <div class="floating-bg">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Login Form Container -->
    <div class="container">
        <h1>User Login</h1>
        <form action="userRegister" method="post">
            <label for="email">Enter your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Enter your Password:</label>
            <input type="password" id="password" name="password" required>

            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
